# 1. Ingestion : Lecture des logs bruts écrits par Rsyslog
<source>
  @type tail
  path /var/log/remote/*/*.log
  pos_file /fluentd/etc/rsyslog.pos
  tag rsyslog.raw
  
  # Lecture du texte brut sans transformation
  <parse>
    @type none
  </parse>
</source>

# 2. Validation : Affichage des logs bruts récupérés dans stdout
<match rsyslog.raw>
  @type stdout
</match>