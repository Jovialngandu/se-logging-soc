services:
  rsyslog-central:
    container_name: soc-rsyslog
    image: rsyslog/rsyslog:latest
    ports:
      - "514:514/udp"
      - "514:514/tcp"
    volumes:
      - ./config/rsyslog/rsyslog.conf:/etc/rsyslog.conf
      - ./logs:/var/log/remote
    restart: always

  client-alpine:
    container_name: soc-client-alpine
    build:
      context: .
      dockerfile: config/client/Dockerfile
    ports:
      - "2222:22"
    environment:
      - SYSLOG_SERVER_IP=${SYSLOG_SERVER_IP:-rsyslog-central}
    depends_on:
      - rsyslog-central
    restart: always
  # fluentd:
  #   container_name: soc-fluentd
  #   image: fluent/fluentd:v1.16-debian-1
  #   user: root
  #   volumes:
  #     - ./config/fluentd/fluent.conf:/fluentd/etc/fluent.conf
  #     - ./logs:/var/log/remote:ro
  #   depends_on:
  #     - rsyslog-central
  #   restart: always
  loki:
    image: grafana/loki:2.9.2
    container_name: soc-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
  fluentd:
    image: grafana/fluent-plugin-loki:master
    container_name: soc-fluentd
    restart: unless-stopped
    volumes:
      - ./config/fluentd/fluent.conf:/fluentd/etc/fluent.conf
      - ./logs:/var/log/remote:ro
    depends_on:
      - loki